<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Логика — Квест, 9 класс</title><style>
*{box-sizing:border-box}body{margin:0;background:#101324;color:#f5f6ff;font:17px/1.55 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:28px 22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #343851;padding-bottom:20px}.brand{font-weight:800;letter-spacing:1px}.tag{color:#b6c2e8;font-size:14px}.hero{padding:55px 0 28px}h1{font-size:clamp(36px,6vw,64px);line-height:1.05;margin:15px 0}h1 span{color:#8ee9f2}h2{font-size:25px;line-height:1.4}.muted{color:#b6bdd6}.pill{background:#262c46;padding:6px 12px;border-radius:30px;font-size:14px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.stats span{padding:12px 18px;border:1px solid #343d59;border-radius:12px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px 24px;background:#8ee9f2;color:#15200d;font-weight:700}button:hover{filter:brightness(1.1)}button:focus-visible{outline:3px solid #90bcff;outline-offset:4px}input{font:inherit;padding:14px;background:#161c32;color:white;border:1px solid #58617f;border-radius:10px;max-width:100%;margin:0 10px 16px 0}.panel{background:#1b2037;border:1px solid #353d59;border-radius:22px;padding:28px;margin:24px 0}.top{display:flex;justify-content:space-between;gap:12px}.bar{height:7px;background:#343c56;border-radius:5px;margin:22px 0}.bar i{display:block;height:100%;background:#8ee9f2;border-radius:5px;transition:width .3s}.answers{display:grid;gap:12px}.choice{text-align:left;background:#252c46;color:white;border:1px solid #444e6f;font-weight:500;display:flex;gap:15px}.choice b{color:#b2c1ec}.choice.correct{background:#22482e;border-color:#8ee9f2}.choice.wrong{background:#582d3b;border-color:#ff9dae}.choice:disabled{cursor:default;opacity:1}pre{background:#0d1121;color:#d7e6ff;padding:20px;border-radius:12px;overflow:auto;font-size:16px;line-height:1.7}#feedback{margin:20px 0;color:#d6e7cb}footer{color:#919ab8;font-size:14px;padding:20px 0}summary{cursor:pointer;padding:13px 0}.score{font-size:72px;font-weight:900;color:#8ee9f2}.secondary{background:#303955;color:white}label{display:block;margin:20px 0 8px}small{font-size:14px}@media(max-width:600px){.panel{padding:20px}header .tag{display:none}.hero{padding-top:32px}.top{flex-wrap:wrap}}
</style><main><header><div class="brand">{ ↻ } КОД-КВЕСТ</div><div class="tag">Информатика / 9 класс</div></header><div id="app"></div><footer>Таблицы истинности · 9 класс</footer></main><script>
const Q=[["Сколько переменных в выражении F = ((A → B) ⊕ ¬C) ↔ ((A ∨ C) ∧ B)?", null, ["2", "3", "4", "6"], 1, "Три различные переменные: A, B и C."], ["Сколько строк с наборами значений нужно для трёх переменных? Заголовок не учитывается.", null, ["3", "6", "8", "9"], 2, "Количество наборов равно 2ⁿ. Для трёх переменных: 2³ = 8."], ["Чему равно ¬A, если A = 0?", null, ["0", "1", "2", "Определить нельзя"], 1, "Отрицание меняет 0 на 1, а 1 на 0."], ["При каком наборе A ∧ B равно 1?", null, ["A = 0, B = 0", "A = 0, B = 1", "A = 1, B = 0", "A = 1, B = 1"], 3, "Конъюнкция истинна, только когда оба значения равны 1."], ["Чему равно A ∨ C при A = 0 и C = 1?", null, ["0", "1", "2", "Определить нельзя"], 1, "Дизъюнкция равна 1, когда хотя бы одно значение равно 1."], ["Когда импликация A → B равна 0?", null, ["A = 0, B = 0", "A = 0, B = 1", "A = 1, B = 0", "A = 1, B = 1"], 2, "Импликация ложна только в случае 1 → 0."], ["Чему равно A ⊕ B при A = 1 и B = 1?", null, ["0", "1", "2", "Определить нельзя"], 0, "Исключающее ИЛИ равно 1, когда значения различаются. При одинаковых значениях результат 0."], ["Когда эквиваленция X ↔ Y равна 1?", null, ["Только при X = 1, Y = 0", "Только при X = 0, Y = 1", "Когда X и Y различаются", "Когда X и Y совпадают"], 3, "Эквиваленция истинна при 0 ↔ 0 и при 1 ↔ 1."], ["Для выражения F = (¬A ∨ B) → (A ⊕ B) выделяют отдельный столбец на каждую переменную и каждую операцию. Сколько всего столбцов?", null, ["4", "5", "6", "8"], 2, "Две переменные и четыре операции (¬, ∨, ⊕, →): 2 + 4 = 6 столбцов. Столбец с номерами строк не добавляем."], ["Вычислите F при A = 0 и B = 0.", "F = (¬A ∨ B) → (A ⊕ B)", ["0", "1", "2", "Значений недостаточно"], 0, "¬A = 1; ¬A ∨ B = 1; A ⊕ B = 0. Поэтому F = 1 → 0 = 0."]];
const app=document.querySelector('#app');let idx=0,answers=[],name='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const count=()=>answers.filter((a,i)=>a===Q[i][3]).length;
function home(){app.innerHTML=`<section class="hero"><span class="pill">МИССИЯ: ОСВОИТЬ ЛОГИКУ</span><h1>Думай. Вычисляй.<br><span>Побеждай.</span></h1><p class="muted">Пройди 10 испытаний: исследуй логические операции<br>и научись строить таблицы истинности.</p><div class="stats"><span>10 вопросов</span><span>10 баллов</span><span>Без таймера</span></div><label for="name">Имя, фамилия и класс <small class="muted">(необязательно)</small></label><input id="name" placeholder="Например: Алия Иванова, 9 А" maxlength="60"><button id="start">Начать игру</button><p class="muted"><small>После ответа — объяснение. В финале — баллы и разбор. В конце отправь результат учителю через WhatsApp или сделай скриншот.</small></p></section>`;document.querySelector('#start').onclick=()=>{name=document.querySelector('#name').value.trim();idx=0;answers=[];question()}}
function question(){const q=Q[idx];app.innerHTML=`<section class="panel"><div class="top"><span class="pill">Испытание ${idx+1} / 10</span><span>★ ${count()} баллов</span></div><div class="bar"><i style="width:${idx*10}%"></i></div><h2>${esc(q[0])}</h2>${q[1]?'<pre>'+esc(q[1])+'</pre>':''}<div class="answers">${q[2].map((a,i)=>`<button class="choice" data-i="${i}"><b>${'АБВГ'[i]}</b><span style="white-space:pre-wrap;font-family:${a.includes('\n')?'monospace':'inherit'}">${esc(a)}</span></button>`).join('')}</div><div id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>${idx===9?'Узнать результат':'Следующий вопрос'}</button></section>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function choose(a){if(answers.length>idx)return;answers.push(a);document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===Q[idx][3])b.classList.add('correct');else if(i===a)b.classList.add('wrong')});document.querySelector('#feedback').textContent=(a===Q[idx][3]?'Верно! +1 балл. ':'Пока неверно. ')+Q[idx][4];const n=document.querySelector('#next');n.hidden=false;n.onclick=()=>{idx++;idx<10?question():result()}}
function result(){const s=count();app.innerHTML=`<section class="panel"><span class="pill">МИССИЯ ЗАВЕРШЕНА</span><h1 style="font-size:36px">${name?esc(name)+', ':''}${s>=8?'отличная работа!':s>=5?'хорошее начало!':'продолжай тренироваться!'}</h1><div class="score">${s}<span style="font-size:30px;color:#b6bdd6"> / 10</span></div><p>${s*10}% правильных ответов · Ошибок: ${10-s}</p><p class="muted">${s===10?'Все испытания пройдены без ошибок.': 'Открой разбор ниже и повтори сложные вопросы.'}</p><button id="again">Играть ещё раз</button> <button id="whatsapp">Отправить в WhatsApp</button> <button class="secondary" id="download">Скачать результат</button></section><h2>Разбор ответов</h2>${Q.map((q,i)=>`<details class="panel" style="margin:12px 0;padding:8px 20px"><summary>${answers[i]===q[3]?'✓':'✕'} ${i+1}. ${esc(q[0])}</summary><p>Ваш ответ: <span style="white-space:pre-wrap">${esc(q[2][answers[i]])}</span></p><p>Правильный ответ: <span style="white-space:pre-wrap">${esc(q[2][q[3]])}</span></p><p class="muted">${esc(q[4])}</p></details>`).join('')}`;document.querySelector('#again').onclick=home;document.querySelector('#whatsapp').onclick=()=>{const t='Таблицы истинности, 9 класс\nУченик: '+(name||'Без имени')+'\nРезультат: '+s+' из 10 ('+s*10+'%)';window.location.href='https://wa.me/?text='+encodeURIComponent(t)};document.querySelector('#download').onclick=()=>{const text='Таблицы истинности — тест, 9 класс\nИгрок: '+(name||'Без имени')+'\nРезультат: '+s+' из 10 ('+s*10+'%)\n\n'+Q.map((q,i)=>(i+1)+'. '+q[0]+'\nОтвет: '+q[2][answers[i]]+'\n'+(answers[i]===q[3]?'Верно':'Неверно')+'\n').join('\n');const u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='Результат_Логика_9.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};window.scrollTo(0,0)}home();
</script></html>
